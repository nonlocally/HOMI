name: HOMI qualification
on:
  pull_request:
  push:
    branches: [main, release/homi-public]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        node: ['20', '22']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/communicate/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux jq bsdextrautils perl libdigest-sha-perl
      - name: macOS dependencies
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: brew install bash tmux jq
      - run: npm ci --ignore-scripts
        working-directory: packages/communicate
      - run: npm run vendor
        working-directory: packages/communicate
      - name: Retained core and integration checks
        run: bash scripts/test-release-core.sh
      - name: Optional configuration checks
        run: |
          python3 scripts/test-profiles.py
          python3 scripts/test-homi-box.py
          bash scripts/test-snapshots.sh
      - name: Build immutable runtime
        run: |
          python3 scripts/test-build-release.py
          python3 scripts/build-release.py
      - name: Qualify the extracted runtime without checkout fallback
        run: |
          mkdir -p "$RUNNER_TEMP/homi-artifact"
          tar -xzf "dist/homi-$(cat VERSION).tar.gz" -C "$RUNNER_TEMP/homi-artifact"
          python3 scripts/qualify-installed.py "$RUNNER_TEMP/homi-artifact/homi-$(cat VERSION)" > "$RUNNER_TEMP/homi-artifact-qualification.json"
      - uses: actions/upload-artifact@v4
        with:
          name: homi-runtime-${{ runner.os }}-node${{ matrix.node }}
          path: dist/homi-*.tar.gz*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homi-qualification-${{ runner.os }}-node${{ matrix.node }}
          path: ${{ runner.temp }}/homi-artifact-qualification.json
          if-no-files-found: warn

  dashboard:
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: homi-runtime-Linux-node20
          path: ${{ runner.temp }}/homi-ui-artifact
      - name: Install isolated browser test dependencies
        run: |
          python -m pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Qualify shipped dashboard assets
        run: |
          tar -xzf "$RUNNER_TEMP/homi-ui-artifact/homi-$(cat VERSION).tar.gz" -C "$RUNNER_TEMP/homi-ui-artifact"
          python scripts/qualify-browser.py "$RUNNER_TEMP/homi-ui-artifact/homi-$(cat VERSION)" --evidence "$RUNNER_TEMP/homi-ui-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homi-dashboard-qualification
          path: ${{ runner.temp }}/homi-ui-evidence
          if-no-files-found: warn

  systemd:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: packages/communicate/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build an independent immutable runtime
        run: |
          python3 scripts/build-release.py
          mkdir -p "$RUNNER_TEMP/homi-systemd-artifact"
          tar -xzf "dist/homi-$(cat VERSION).tar.gz" -C "$RUNNER_TEMP/homi-systemd-artifact"
      - name: Qualify actual scoped systemd service lifecycle on the disposable runner
        run: |
          python3 scripts/qualify-systemd.py "$RUNNER_TEMP/homi-systemd-artifact/homi-$(cat VERSION)" \
            --work "$RUNNER_TEMP/homi-systemd-evidence" --disposable-ci --start-user-manager
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homi-systemd-qualification
          path: ${{ runner.temp }}/homi-systemd-evidence
          if-no-files-found: warn

  homebrew:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: packages/communicate/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the immutable runtime independently of the core test matrix
        run: python3 scripts/build-release.py
      - name: Qualify canonical Homebrew install and reinstall on the disposable runner
        run: |
          version="$(cat VERSION)"
          archive="$GITHUB_WORKSPACE/dist/homi-$version.tar.gz"
          sha="$(shasum -a 256 "$archive" | awk '{print $1}')"
          python3 scripts/render-homebrew-formula.py "$version" "$sha" "$RUNNER_TEMP/homi.rb"
          python3 scripts/qualify-homebrew.py "$archive" "$RUNNER_TEMP/homi.rb" \
            --work "$RUNNER_TEMP/homi-brew-evidence" --disposable-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homi-homebrew-qualification
          path: ${{ runner.temp }}/homi-brew-evidence
          if-no-files-found: warn
